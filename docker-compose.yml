version: '3'

services:
  app:
    image: growilabs/growi:7
    ports:
      - 127.0.0.1:3000:3000    # localhost only by default
    links:
      - mongo:mongo
      - elasticsearch:elasticsearch
    depends_on:
        mongo:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/growi
      - ELASTICSEARCH_URI=http://elasticsearch:9200/growi
      # Allow slow index creation (kuromoji dictionary load) to finish on small,
      # memory-constrained hosts instead of timing out (default 8000ms).
      - ELASTICSEARCH_REQUEST_TIMEOUT=60000
      - BULK_EXPORT_PDF_CONVERTER_URI=http://pdf-converter:3010
      - PASSWORD_SEED=changeme
      # - FILE_UPLOAD=mongodb   # activate this line if you use MongoDB GridFS rather than AWS
      # - FILE_UPLOAD=local     # activate this line if you use local storage of server rather than AWS
      # - MATHJAX=1             # activate this line if you want to use MathJax
      # - PLANTUML_URI=http://  # activate this line and specify if you use your own PlantUML server rather than public plantuml.com
      # - FORCE_WIKI_MODE='public'    # activate this line to force wiki public mode
      # - FORCE_WIKI_MODE='private'   # activate this line to force wiki private mode

    restart: unless-stopped
    # Join both the private stack network (to reach mongo/elasticsearch by name)
    # and the shared `coolify` proxy network so Traefik can route to it.
    networks:
      - default
      - coolify
    labels:
      # Tell Traefik which network to use to reach this container (it is on more
      # than one). Without this the proxy may pick the private network and 503.
      - traefik.docker.network=coolify
    volumes:
      - growi_data:/data
      - page_bulk_export_tmp:/tmp/page-bulk-export

  mongo:
    image: mongo:8.2
    # For MongoDB 6.x
    # image: mongo:6.0
    restart: unless-stopped
    networks:
      - default
    volumes:
      - mongo_configdb:/data/configdb
      - mongo_db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # Ensure the Elasticsearch data volume is owned by the elasticsearch user
  # (uid 1000). A freshly created named volume can be root-owned, which makes
  # Elasticsearch fail at start-up with an AccessDeniedException.
  elasticsearch-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1000:0 /usr/share/elasticsearch/data && echo 'es data dir ownership fixed'"]
    networks:
      - default
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: "no"

  elasticsearch:
    # Build a local image with the Japanese full-text search plugins
    # (analysis-kuromoji / analysis-icu) baked in. This avoids downloading the
    # plugins on every container start, which fails on hosts with restricted /
    # proxied outbound network access (e.g. Coolify) and makes ES crash-loop.
    build:
      context: ./elasticsearch/v9
      dockerfile: Dockerfile
    # For Elasticsearch 8.x
    # build:
    #   context: ./elasticsearch/v8
    #   dockerfile: Dockerfile
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    networks:
      - default
    environment:
      # single-node disables the production bootstrap checks (e.g. the
      # vm.max_map_count check) that cannot be satisfied on managed hosts where
      # kernel parameters are not tunable.
      - discovery.type=single-node
      # Do not require mlockall: many managed hosts cap the memlock ulimit, and
      # a failed lock would otherwise crash the node.
      - bootstrap.memory_lock=false
      # Disable Machine Learning: GROWI does not use it and it spawns a native
      # controller process + reserves memory, wasteful on small hosts.
      - xpack.ml.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"  # increase amount if you have enough memory
      - LOG4J_FORMAT_MSG_NO_LOOKUPS=true # CVE-2021-44228 mitigation for Elasticsearch <= 6.8.20/7.16.0
    restart: unless-stopped
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  pdf-converter:
    image: growilabs/pdf-converter:1
    restart: unless-stopped
    networks:
      - default
    volumes:
      - page_bulk_export_tmp:/tmp/page-bulk-export

networks:
  # Private network for intra-stack communication (mongo / elasticsearch).
  default:
  # Coolify's shared proxy network; the Traefik reverse proxy lives here, so the
  # `app` service must join it to be reachable from outside.
  coolify:
    external: true

volumes:
  growi_data:
  mongo_configdb:
  mongo_db:
  es_data:
  page_bulk_export_tmp:
