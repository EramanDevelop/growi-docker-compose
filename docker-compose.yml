version: '3'

services:
  # DIAGNOSTIC: read and print the captured Elasticsearch startup log so it is
  # visible through Coolify's application logs (which only show the app service).
  app:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do echo '==== ELASTICSEARCH STARTUP LOG ===='; cat /esshared/es-startup.log 2>/dev/null || echo '(no log captured yet)'; echo '==== END ===='; sleep 15; done"]
    restart: unless-stopped
    volumes:
      - es_shared:/esshared

  mongo:
    image: mongo:8.2
    restart: unless-stopped
    volumes:
      - mongo_configdb:/data/configdb
      - mongo_db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6

  elasticsearch-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1000:0 /usr/share/elasticsearch/data && echo 'es data dir ownership fixed'"]
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: "no"

  elasticsearch:
    build:
      context: ./elasticsearch/v9
      dockerfile: Dockerfile
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    # DIAGNOSTIC: capture stdout/stderr to a shared volume for inspection.
    entrypoint: ["/bin/sh", "-c"]
    command: ["/usr/local/bin/docker-entrypoint.sh eswrapper 2>&1 | tee /esshared/es-startup.log"]
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - LOG4J_FORMAT_MSG_NO_LOOKUPS=true
    restart: unless-stopped
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - es_shared:/esshared

  pdf-converter:
    image: growilabs/pdf-converter:1
    restart: unless-stopped
    volumes:
      - page_bulk_export_tmp:/tmp/page-bulk-export

volumes:
  growi_data:
  mongo_configdb:
  mongo_db:
  es_data:
  es_shared:
  page_bulk_export_tmp:
